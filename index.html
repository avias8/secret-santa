<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Family Secret Santa</title>
  <meta name="description" content="Christmas 2026: find your name tag and pull a name from Santa's sack.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#4f0b17">
  <meta property="og:title" content="🎅 Family Secret Santa 2026">
  <meta property="og:description" content="Tap your name and pull a name from Santa's sack!">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎅</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Inter:wght@400;600&family=Mountains+of+Christmas:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="family.css">
</head>
<body>
  <div class="lights" id="lights" aria-hidden="true"></div>
  <div class="sky" aria-hidden="true"><div class="sleigh" id="sleigh"></div></div>
  <div class="ground" aria-hidden="true"></div>
  <div class="fx" id="fx" aria-hidden="true"></div>
  <button class="sound" id="sound" type="button" aria-label="Sound on">🔔</button>

  <main class="wrap">
    <div class="moon" aria-hidden="true"></div>
    <div class="eyebrow">Christmas 2026</div>
    <h1 id="title">Secret Santa</h1>

    <div class="santa-row">
      <div class="santa" id="santa" role="img" aria-label="Santa"></div>
      <div class="bubble" id="bubble" aria-hidden="true"></div>
      <p class="sr" id="said" aria-live="polite"></p>
    </div>

    <!-- hat still open -->
    <section id="open" class="hidden">
      <div class="tags" id="soFar"></div>
    </section>

    <!-- pick your name -->
    <section id="pick" class="hidden">
      <div class="tags" id="tags"></div>
    </section>

    <!-- Santa's sack -->
    <section id="drawStep" class="hidden">
      <div id="before">
        <button class="sack" id="sack" type="button" aria-label="Reach into Santa's sack"></button>
        <button class="btn gold" id="drawBtn" type="button">🎁 Reach into the sack</button><br>
        <button class="link" id="notMe" type="button">Not you?</button>
      </div>

      <div class="bigtag hidden" id="bigtag">
        <div class="bigtag-body">
          <svg class="holly-corner" viewBox="0 0 54 30" aria-hidden="true">
            <path d="M27 18C19 6 8 4 2 9c5 1 6 5 4 8 4-1 7 1 7 5 4-3 9-4 14-4z" fill="#2f7356"/>
            <path d="M27 18c8-12 19-14 25-9-5 1-6 5-4 8-4-1-7 1-7 5-4-3-9-4-14-4z" fill="#265f47"/>
            <circle cx="23" cy="20" r="4" fill="#d43a44"/><circle cx="31" cy="20" r="4" fill="#d43a44"/><circle cx="27" cy="14.5" r="4" fill="#e65059"/>
          </svg>
          <div class="line"><span class="lbl">From</span><span class="val" id="from"></span></div>
          <div class="line"><span class="lbl">To</span><span class="val" id="to" aria-live="polite"></span></div>
        </div>
        <div class="seal" id="seal" aria-hidden="true">✻</div>
      </div>

      <div id="after" class="hidden">
        <div class="facts" id="facts"></div>
        <p class="note" id="note"></p>
        <button class="btn" id="done" type="button">Hide my tag</button>
      </div>
      <p class="lock-note hidden" id="lockNote"></p>
    </section>

    <p class="foot">Every name is in Santa's sack exactly once · <a href="admin/">Organiser</a></p>
  </main>

  <script src="app.js"></script>
  <script src="family.js"></script>
</body>
</html>
